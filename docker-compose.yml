services:
  api-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: lab-report-publisher:local
    init: true
    restart: unless-stopped
    environment:
      TZ: UTC
      LAB_DB_PATH: /data/lab_reports.db
    ports:
      - "${APP_PORT_1:-8001}:8000"
    volumes:
      - lab-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  api-2:
    image: lab-report-publisher:local
    init: true
    restart: unless-stopped
    # Build once; the second replica reuses the image produced for api-1.
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TZ: UTC
      LAB_DB_PATH: /data/lab_reports.db
    ports:
      - "${APP_PORT_2:-8002}:8000"
    volumes:
      - lab-data:/data
    depends_on:
      api-1:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  lab-data:
    name: lab-report-data
